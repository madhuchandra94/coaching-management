<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programmers Point Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg,#d9e4f5 0%,#ecd0f3 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255,255,255,0.93); backdrop-filter: blur(3px);
      border-radius: 30px; max-width: 950px;
      margin: 56px auto; box-shadow: 0 8px 56px rgba(70,79,131,.11);
      border:none;
    }
    .logo-bubble {
      width: 110px; height: 110px; background: #fff;
      border-radius: 100px; box-shadow: 0 8px 42px #aac3da;
      margin: -68px auto 12px auto; display: flex; align-items:center;justify-content:center; z-index:2;
    }
    .section-title {
       font-size: 1.15rem; font-weight:700; color: #5c6ac4;
       background: #f7fafd; padding: 12px 24px 10px 24px;
       border-radius: 16px; margin-bottom:16px; margin-top:34px;
       display: flex; align-items:center; gap:6px; box-shadow:0 2px 8px rgba(92,106,196,.04);
    }
    .section-title i { color: #b7c6fa; margin-right:5px; }
    .form-control,.form-select { border-radius: 11px; background: #f9fbfc; }
    .form-check-input { border-radius:30px;}
    .step-hide { display: none; }
    .btn-primary {
      background:linear-gradient(93deg,#7a89fa,#bc93fc);padding:12px 0;
      font-weight:600; border-radius:18px; border:none;
      box-shadow:0 5px 22px -6px #aab2ee;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card glass-card px-0">
      <div class="logo-bubble">
        <img src="images/programmers-logo.png" alt="Logo" style="width:77px;height:auto;border-radius:50%;">
      </div>
      <div class="card-body px-lg-5 px-3 pb-5 pt-1">
        <form id="regForm" method="post" enctype="multipart/form-data">
          <div class="section-title"><i class="fas fa-user"></i> Personal Details</div>
          <div class="row mb-1 gx-4 gy-4">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" name="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Father/Husband Name</label>
              <input type="text" class="form-control" name="f_h">
            </div>
            <div class="col-md-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" class="form-control" name="dob">
            </div>
            <div class="col-md-6">
              <label class="form-label">Gender</label>
              <div class="d-flex gap-4 mt-2">
                <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="male" value="male" checked><label class="form-check-label" for="male">Male</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="female" value="female"><label class="form-check-label" for="female">Female</label></div>
                <div class="form-check"><input class="form-check-input" type="radio" name="gender" id="other" value="other"><label class="form-check-label" for="other">Other</label></div>
              </div>
            </div>
          </div>
          <div class="section-title"><i class="fas fa-award"></i> Designation</div>
          <div class="row gx-4">
            <div class="col-md-6 mb-2">
              <label class="form-label">Designation</label>
              <select name="role" class="form-select">
                <option value="">Select Designation</option>
                {% for c in role %}
                  <option value="{{c.id}}">{{c.role}}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="section-title"><i class="fas fa-address-book"></i> Contact Details</div>
          <div class="row gx-4 gy-4">
            <div class="col-md-6">
              <label class="form-label">Email *</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Mobile Number</label>
              <input type="tel" class="form-control" name="mobile" maxlength="10">
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea class="form-control" name="address" rows="2"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Country</label>
              <select name="country" class="form-select">
                <option value="">Select Country</option>
                {% for c in country %}
                  <option value="{{c.id}}">{{c.name}}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">State</label>
              <select name="state" class="form-select">
                <option value="">Select State</option>
                {% for c in state %}
                  <option value="{{c.id}}">{{c.name}}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">City</label>
              <select name="city" class="form-select">
                <option value="">Select City</option>
                {% for c in city %}
                  <option value="{{c.id}}">{{c.name}}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Pincode</label>
              <input type="number" class="form-control" name="pincode" maxlength="6">
            </div>
          </div>
          <!-- Educational Details - updated as per your instructions -->
          <div class="section-title"><i class="fas fa-graduation-cap"></i> Educational Details</div>
          <div class="row gx-4 gy-4">
            <div class="col-md-6">
              <label class="form-label">Highest Qualification</label>
              <input type="text" class="form-control" name="qualification">
            </div>
            <div class="col-md-6">
              <label class="form-label">Specialization</label>
              <input type="text" class="form-control" name="specialization">
            </div>
            <div class="col-md-4">
              <label class="form-label">Passing Year</label>
              <input type="number" min="1900" max="2099" class="form-control" name="passing_year" placeholder="e.g. 2022">
            </div>
            <div class="col-md-4">
              <label class="form-label">College or University Name</label>
              <input type="text" class="form-control" name="college_university">
            </div>
            <div class="col-md-4">
              <label class="form-label">Percentage or CGPA</label>
              <input type="text" class="form-control" name="percentage_cgpa" placeholder="e.g. 78% or 8.3 CGPA">
            </div>
          </div>

          <!-- Professional Details -->
          
          <div class="section-title"><i class="fas fa-briefcase"></i> Professional Details</div>
          <div class="mb-3">
            <label class="form-label">Work Status</label>
            <div class="d-flex gap-5 mt-2">
              
            <div class="form-check">
                <input type="radio" class="form-check-input" name="work_status" id="fresher" value="fresher" 
                onclick="show_exp(false)" checked>
                <label class="form-check-label" for="fresher">Fresher</label>
            </div>

              <div class="form-check">
                <input type="radio" class="form-check-input" name="work_status" id="experienced" value="experienced" 
                onclick="show_exp(true)">
                <label class="form-check-label" for="experienced">Experienced</label></div>
            </div>
          </div>
          <div id="professional-section" class="step-hide">
            <div class="row gx-4 gy-4">
              <div class="col-md-6"><label class="form-label">Company Name</label><input type="text" class="form-control" name="Company_name"></div>
              <div class="col-md-6"><label class="form-label">Post</label><input type="text" class="form-control" name="Post_Name"></div>
              <div class="col-md-6"><label class="form-label">Total Experience</label><select class="form-select" name="Total_Experience"><option value="">Select Experience</option><option value=">1">&gt; 1 Year</option><option value="0-1">0-1 Year</option><option value="1-2">1-2 Year</option><option value="2-3">2-3 Year</option><option value="3-4">3-4 Year</option><option value="4-5">4-5 Year</option><option value="<5">&lt; 5 Year</option></select></div>
              <div class="col-md-6"><label class="form-label">Notice Period</label><select class="form-select" name="Notice_period"><option value="">Select Notice Period</option><option value="15days">15 days</option><option value="15-30days">15-30 days</option><option value="1-2months">1-2 months</option><option value="2-3months">2-3 months</option><option value=">3months">&gt; 3 months</option></select></div>
              <div class="col-md-6"><label class="form-label">Salary</label><input type="number" class="form-control" name="Salary"></div>
              <div class="col-md-6"><label class="form-label">Upload Salary Slip</label><input type="file" class="form-control" name="salary_slip"><small class="form-text text-muted mb-3">Upload 3 month salary slip.</small></div>
            </div>
          </div>
          <div class="section-title"><i class="fas fa-file-upload"></i> Documents</div>
          <div class="row gx-4 gy-4 mb-4">
            <div class="col-md-6"><label class="form-label">Upload Aadhaar</label><input type="file" class="form-control" name="adhar_upload"><small class="form-text text-muted">Upload your Aadhaar.</small></div>
            <div class="col-md-6"><label class="form-label">Upload PAN</label><input type="file" class="form-control" name="pan_upload"><small class="form-text text-muted">Upload your PAN.</small></div>
          </div>
          <div class="form-check mb-3 mt-3 ps-2">
            <input type="checkbox" class="form-check-input" id="agree" name="agree" required>
            <label class="form-check-label" for="agree">
              Agree to the terms and conditions
            </label>
          </div>
          <div class="d-grid"><button type="submit" class="btn btn-primary btn-lg">Register</button></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function show_exp(is_exp) {
        var expDiv = document.getElementById('professional-section');
        if (is_exp) {
            expDiv.style.display = 'block';
        } else {
            expDiv.style.display = 'none';
        }
    }
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
